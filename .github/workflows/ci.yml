name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check, lint, format, unit testlar
        run: npm run check
      - run: npm run build
      - name: Playwright brauzeri
        run: npx playwright install --with-deps chromium
      - name: E2E testlar (GitHub Pages prefiksi bilan)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erptest
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://erp:erptest@127.0.0.1:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - name: Server type-check
        run: npx tsc --noEmit -p server/tsconfig.json
      - name: Server testlari (kirish, huquqlar, hujumlar)
        run: npx vitest run --config server/vitest.config.ts
      - name: Yig'ish va paket
        run: |
          npm run build:server
          (cd server && node build.mjs)
          scripts/package-release.sh test
      - name: Serverli e2e testlar
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-server
          path: playwright-report
          retention-days: 7
