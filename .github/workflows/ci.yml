name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check, lint, format, unit testlar
        run: npm run check
      - run: npm run build
      - name: Playwright brauzeri
        run: npx playwright install --with-deps chromium
      - name: E2E testlar (GitHub Pages prefiksi bilan)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
