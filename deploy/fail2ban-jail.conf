# SMM ERP: bitta IP'dan 10 daqiqada 20 ta noto'g'ri parol/kod — 1 soatga bloklanadi (ilova o'zi ham har login uchun bloklaydi).
# Ofis IP'sini hech qachon bloklamaslik uchun: ignoreip = 127.0.0.1/8 ::1 <ofis-IP>
[smm-erp-login]
enabled = true
port = http,https
filter = smm-erp-login
logpath = /var/log/nginx/access.log
# Ubuntu 24.04'da standart backend = systemd (logpath e'tiborsiz qoladi) — fayldan o'qishni majburlaymiz
backend = auto
maxretry = 20
findtime = 10m
bantime = 1h
