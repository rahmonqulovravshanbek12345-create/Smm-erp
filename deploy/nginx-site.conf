# SMM ERP sayti. HTTPS'ni certbot qo'shadi (http → https yo'naltirish bilan).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn erp_conn 50;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Yashirin fayllar hech qachon berilmaydi
    location ~ /\. { deny all; return 404; }

    location = /api/auth/login {
        limit_req zone=erp_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/smm-erp-proxy.conf;
    }
    location /api/ {
        limit_req zone=erp_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/smm-erp-proxy.conf;
    }
    location / {
        include /etc/nginx/smm-erp-proxy.conf;
    }
}
